name: RetailPulse quality checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src dashboard run_pipeline.py reports/create_executive_report.py
      - name: Structural project check
        run: python scripts/check_project.py
